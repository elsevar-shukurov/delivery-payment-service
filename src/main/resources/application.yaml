server:
  port: 9093
spring:
  datasource:
    url:
      jdbc:postgresql://localhost:5432/payment_db
    username: postgres
    password: 1234
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs